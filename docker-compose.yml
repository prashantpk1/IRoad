name: iroad-client-test

services:
  redis:
    image: redis:7-alpine
    container_name: iroad-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iroad-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUNNING_IN_DOCKER: "1"
      DB_HOST: host.docker.internal
      DB_NAME: iroad_client
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8001"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      # Host 8011 so local runserver + cloudflared can own 8001 without conflict.
      - "8011:8001"
