{% load static %}
<!-- Page Header Section Start -->
<div class="page-header bg-section parallaxie">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <div class="page-header-box">
          <h1>{{ header_title }}</h1>
          <nav class="wow fadeInUp" aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item">
                <a href="{% url 'iroad_frontend:home' %}">
                  {% if lang == 'ar' %}{{ home.nav_home_ar|default:home.nav_home_en|default:"Home" }}{% else %}{{ home.nav_home_en|default:"Home" }}{% endif %}
                </a>
              </li>
              <li class="breadcrumb-item active" aria-current="page">
                {{ error_code }} Error
              </li>
            </ol>
          </nav>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- Page Header Section End -->

<!-- error Page start -->
<div class="error-page">
  <div class="container">
    <div class="row">
      <div class="col-lg-12">
        <div class="error-page-image wow fadeInUp">
          <img
            src="{% static 'landing/images/404-error-img.png' %}"
            alt="{{ error_code }} error"
          />
        </div>
        <div class="error-page-content">
          <div class="section-title">
            <h2>{{ heading }}</h2>
          </div>
          <div class="error-page-content-body">
            <p class="wow fadeInUp" data-wow-delay="0.2s">
              {{ message }}
            </p>
            <a
              class="btn-default wow fadeInUp"
              data-wow-delay="0.4s"
              href="{{ home_url }}"
              ><span>{{ home_label }}</span></a
            >
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- error Page end -->
