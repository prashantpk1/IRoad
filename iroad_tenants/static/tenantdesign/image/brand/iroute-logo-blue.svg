<svg width="1400" height="500" viewBox="0 0 1400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .iRoute-text {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 200px;
        font-weight: 900;
        letter-spacing: -5px;
        fill: #1E40AF;
      }
    </style>
    
    <filter id="shadow" x="-50%" y="-30%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- White Background -->
  <rect width="1400" height="500" fill="#FFFFFF"/>
  
  <!-- IRoute Text - Blue -->
  <text x="80" y="330" class="iRoute-text" filter="url(#shadow)" font-weight="bold">IRoute</text>
</svg>
